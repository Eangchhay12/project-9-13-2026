apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: nexa-admin
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: nexa-admin
spec:
  selector:
    matchLabels: { app: mysql }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: admin_system }
            - { name: MYSQL_USER, value: admin }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: nexa-secrets, key: MYSQL_PASSWORD } } }
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: nexa-secrets, key: MYSQL_ROOT_PASSWORD } } }
          volumeMounts: [{ name: mysql-data, mountPath: /var/lib/mysql }]
      volumes: [{ name: mysql-data, persistentVolumeClaim: { claimName: mysql-pvc } }]
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: nexa-admin
spec:
  selector: { app: mysql }
  ports: [{ port: 3306, targetPort: 3306 }]
