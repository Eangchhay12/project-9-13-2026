apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nexa-admin
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: project9-13-2026-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: nexa-admin
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: 80, nodePort: 30080 }]
